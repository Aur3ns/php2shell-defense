name: validate
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate.py
      - name: Correlation unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Correlation example
        run: python tools/correlate.py tests/correlation_example.jsonl

      - name: Synthetic measurement report
        run: python tools/evaluate.py --labels tests/evaluation/labels.json --alerts tests/evaluation/alerts.json

      - name: End-to-end offline pipeline
        run: python -m tools.pipeline --events tests/pipeline/events.jsonl --labels tests/pipeline/labels.json --output pipeline-report.json
      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-pipeline-report
          path: pipeline-report.json

      - name: Normalize native-style security events
        run: |
          python -m tools.ingest --source suricata --input tests/adapters/suricata.jsonl --output suricata.normalized.jsonl --suricata-destination-host web-demo
          python -m tools.ingest --source falco --input tests/adapters/falco.jsonl --output falco.normalized.jsonl
          python -m tools.ingest --source wazuh --input tests/adapters/wazuh.jsonl --output wazuh.normalized.jsonl
          cat suricata.normalized.jsonl falco.normalized.jsonl wazuh.normalized.jsonl > multi-engine.jsonl
          python -c "from pathlib import Path; from tools.pipeline import run; import json; rows=[json.loads(x) for x in Path('multi-engine.jsonl').read_text().splitlines()]; result=run(rows); assert result['correlations'] and result['correlations'][0]['host']=='web-demo'; Path('multi-engine-report.json').write_text(json.dumps(result, indent=2))"
      - name: Archive multi-engine example
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-multi-engine-report
          path: multi-engine-report.json
