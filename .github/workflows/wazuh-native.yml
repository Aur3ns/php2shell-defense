name: Wazuh native smoke test
on: [push, pull_request]
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate rules using Wazuh manager container
        run: |
          docker run --rm --entrypoint bash \
            -v "$GITHUB_WORKSPACE/wazuh/php2shell_rules.xml:/var/ossec/etc/rules/php2shell_rules.xml:ro" \
            wazuh/wazuh-manager:4.12.0 -lc \
            '/var/ossec/bin/wazuh-analysisd -t'
