# Experimental heuristic, pass and log only; tune for legitimate file uploads.
# Do not change SecRuleEngine globally.
SecRule REQUEST_METHOD "@streq POST" "id:9900200,phase:2,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx \.php$" "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Length "@ge 300000" "t:none,pass,log,msg:'Experimental large PHP POST',tag:'php2shell-heuristic',severity:'WARNING'"