name: Falco native validation
on: [push, pull_request]
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate experimental rules in official Falco container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/falco/php_web_children.yaml:/rules/php_web_children.yaml:ro" \
            --entrypoint falco \
            falcosecurity/falco:0.45.0 \
            --validate /rules/php_web_children.yaml
