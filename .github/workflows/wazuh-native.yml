name: Wazuh native smoke test
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start Wazuh container
        run: |
          docker run -d --name wazuh-validation --ulimit nofile=65536:65536 \
            -v "$GITHUB_WORKSPACE/wazuh/php2shell_rules.xml:/var/ossec/etc/rules/php2shell_rules.xml:ro" \
            wazuh/wazuh-manager:4.12.0
      - name: Wait for config initialization, then validate rules
        run: |
          for i in $(seq 1 45); do
            if docker exec wazuh-validation test -f /var/ossec/etc/internal_options.conf 2>/dev/null; then
              docker exec wazuh-validation /var/ossec/bin/wazuh-analysisd -t
              exit $?
            fi
            sleep 2
          done
          echo "Wazuh configuration initialization timed out"
          exit 1
      - name: Diagnostics on failure
        if: failure()
        run: docker logs --tail 100 wazuh-validation || true
      - name: Cleanup
        if: always()
        run: docker rm -f wazuh-validation || true
