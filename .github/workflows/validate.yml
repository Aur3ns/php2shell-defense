name: validate
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate.py
      - name: Correlation unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Correlation example
        run: python tools/correlate.py tests/correlation_example.jsonl

      - name: Synthetic measurement report
        run: python tools/evaluate.py --labels tests/evaluation/labels.json --alerts tests/evaluation/alerts.json

      - name: End-to-end offline pipeline
        run: python -m tools.pipeline --events tests/pipeline/events.jsonl --labels tests/pipeline/labels.json --output pipeline-report.json
      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-pipeline-report
          path: pipeline-report.json
